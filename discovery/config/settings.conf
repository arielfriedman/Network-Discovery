# settings.conf - defaults for discover.sh. Command-line flags win over these.

# --- scope -------------------------------------------------------------
# TARGET_CIDR: leave empty to auto-detect from the default route.
TARGET_CIDR=""

# Only these prefixes are scanned without --allow-public. RFC1918 + CGNAT +
# link-local. This is the guard that stops an accidental sweep of someone
# else's network if you are ever on a VPN, hotspot or guest wifi.
ALLOWED_PREFIXES="10. 172.16. 172.17. 172.18. 172.19. 172.20. 172.21. 172.22. 172.23. 172.24. 172.25. 172.26. 172.27. 172.28. 172.29. 172.30. 172.31. 192.168. 100.64. 169.254. 127."

# --- pacing ------------------------------------------------------------
# nmap -T template: 3 = polite/normal, 4 = fast (fine on your own LAN).
NMAP_TIMING=4
# Ports for the standard deep scan. --deep replaces this with all 65535.
NMAP_PORTS="--top-ports 1000"
# Added to --top-ports N: home-lab ports that are not in nmap's top 1000
# (Proxmox VE 8006, Backup Server 8007, Home Assistant 8123, Plex, Jellyfin,
# Uptime Kuma, Portainer, Syncthing, Node-RED, Netdata, Docker/Kubernetes APIs, MQTT ...).
EXTRA_PORTS="8006,8007,8123,32400,8096,3001,9443,8384,1880,19999,2375,2376,6443,16443,10250,2379,2380,1883,8883,5601,9200,51820"
# Max parallel per-host deep scans.
MAX_PARALLEL=8
# Give up on a single host's deep scan after this long.
HOST_SCAN_TIMEOUT="10m"
# Skip the deep stage entirely if the sweep finds more than this many hosts
# (protects you from a 3-hour run on a big flat network). 0 = no limit.
DEEP_SCAN_HOST_LIMIT=256

# --- what to run -------------------------------------------------------
DO_INSTALL=1        # install missing packages
DO_PASSIVE=1        # mDNS, SSDP, NetBIOS, LLDP
DO_DEEP=1           # per-host service + OS detection
DO_AUTH=0           # SNMP / SSH authenticated collection (prompts for creds)
DO_CLOUD=1          # cloud inventory (auto-skips when no CLI or creds)
DO_WAN=1            # gateway, traceroute, public IP, DNS
DO_VULN=0           # nmap vuln scripts - slow and noisy, opt in with --vuln

# --- output ------------------------------------------------------------
DESKTOP_DIR="$HOME/Desktop"
KEEP_RUNS=20        # prune report dirs beyond this many
